/* ============ tokens ============ */
:root{
  --paper:#E7E3DA; --paper-2:#DCD7CB; --ink:#1A1917; --ink-soft:#4A4741;
  --teal:#1A1917; --teal-deep:#1A1917; --teal-tint:#DCD7CB;
  --gold:#9B3418; --gold-tint:#EDE7DA;
  --coral:#9B3418; --coral-tint:#EFE0D8;
  --white:#F0EDE4;
  --radius:0px; --bd:1px solid rgba(26,25,23,.22);
  --shadow:none;
  --font-round:"Instrument Serif","Songti SC","STSong","Noto Serif SC",serif,'Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-body:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-round);font-weight:400;line-height:1.15;letter-spacing:-.015em}
a{color:var(--teal-deep)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:0}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ============ primitives ============ */
.stk{background:var(--white);border:var(--bd);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--bd);border-radius:12px;background:var(--white);color:var(--ink);padding:10px 18px;font-family:var(--font-round);font-weight:700;box-shadow:var(--shadow);min-height:44px;transition:transform .06s ease,box-shadow .06s ease;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--teal);color:var(--white)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:44px}
.btn.danger{background:var(--coral);color:var(--white)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.chip{border:var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--white);box-shadow:2px 2px 0 var(--ink);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.chip.plus{background:var(--teal-tint)}
.chip.minus{background:var(--coral-tint)}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--gold-tint)}
input[type=text],input[type=number],select,textarea{border:var(--bd);border-radius:10px;padding:8px 10px;background:var(--white);font:inherit;color:var(--ink);width:100%}
input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label{font-weight:700;font-size:14px}

/* ============ app shell ============ */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper-2);position:sticky;top:0;height:100vh}
.rail .logo{display:flex;align-items:center;gap:8px;font-family:var(--font-round);font-weight:800;text-decoration:none;color:var(--ink);padding:6px 8px 16px;font-size:17px}
.rail a.tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;border:2px solid transparent;min-height:44px}
.rail a.tab:hover{background:var(--white)}
.rail a.tab[aria-current=page]{background:var(--white);border:var(--bd);box-shadow:2px 2px 0 var(--ink)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink-soft);padding:8px}
.main{padding:26px 28px 90px;max-width:1120px;width:100%}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:28px;font-weight:800}
.pagehead .sub{color:var(--ink-soft);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs .chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* classroom */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{padding:14px;position:relative;cursor:pointer;background:var(--white)}
.card .pick{position:absolute;top:8px;right:8px;width:26px;height:26px;border:var(--bd);border-radius:8px;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.card.sel{background:var(--gold-tint)}
.card.sel .pick{background:var(--gold)}
.card .av{width:44px;height:44px;border-radius:50%;border:var(--bd);display:flex;align-items:center;justify-content:center;font-family:var(--font-round);font-weight:800;font-size:19px;margin-bottom:8px}
.card .nm{font-weight:800;font-size:15px}
.card .lv{font-size:12px;font-weight:700;color:var(--ink-soft)}
.card .pts{display:flex;gap:12px;margin-top:8px;font-family:var(--font-round)}
.card .net{font-weight:800;font-size:17px}
.card .net.neg{color:var(--coral)}
.card .wallet{font-size:13px;color:var(--ink-soft)}
.card .roomlink{position:absolute;bottom:10px;right:10px;font-size:13px;text-decoration:none;font-weight:700;padding:4px}
.float{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--font-round);font-weight:800;font-size:20px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:5}
@keyframes floatUp{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -46px}}
.rail-legend{display:flex;gap:10px;flex-wrap:wrap}
.legend{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.legend b{color:var(--ink)}

/* records & lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.row .who{font-weight:700;font-size:14px;flex:1;min-width:180px}
.row .val{font-family:var(--font-round);font-weight:800;font-size:18px;min-width:52px;text-align:right}
.row .val.neg{color:var(--coral)}
.row .meta{font-size:12.5px;color:var(--ink-soft);min-width:150px}
.row.undone{opacity:.55}
.row.undone .who{text-decoration:line-through}
.empty{padding:34px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:34px;display:block;margin-bottom:8px}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item{padding:18px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .emoji{font-size:34px}
.item h3{font-size:16px}
.item .desc{font-size:13px;color:var(--ink-soft);flex:1}
.item .price{font-family:var(--font-round);font-weight:800;font-size:16px}
.item .row-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.off{opacity:.6}
.queue{margin-bottom:26px}
.reqrow{display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.reqrow .st-who{font-weight:800}
.reqrow .st-gift{flex:1;min-width:170px}
.pill{font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:7px;padding:1px 7px}
.pill.pending{background:var(--gold-tint)}
.pill.approved{background:var(--teal-tint)}
.pill.declined{background:var(--coral-tint)}

/* leaderboard */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.pod{padding:18px;text-align:center}
.pod .medal{font-size:34px}
.pod .nm{font-family:var(--font-round);font-weight:800;font-size:18px}
.pod .sc{font-size:14px;color:var(--ink-soft)}
.statline{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.stat{padding:12px 18px}
.stat .k{font-size:12px;font-weight:800;text-transform:none;color:var(--ink-soft)}
.stat .v{font-family:var(--font-round);font-weight:800;font-size:20px}

/* student room */
.room{max-width:900px;margin:0 auto;padding:26px 20px 80px}
.room .back{margin-bottom:18px}
.roomhead{padding:26px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--gold-tint)}
.roomhead .bigav{width:84px;height:84px;border-radius:50%;border:var(--bd);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--white)}
.roomhead h1{font-size:30px}
.lvl-bar{height:16px;border:var(--bd);border-radius:999px;background:var(--white);overflow:hidden;margin-top:8px;width:min(320px,100%)}
.lvl-bar i{display:block;height:100%;background:var(--gold);transition:width .5s ease}
.room .walletbox{font-family:var(--font-round);text-align:center}
.room .walletbox .v{font-size:30px;font-weight:800}
.shelf{margin-top:26px}
.shelf h2{font-size:20px;margin-bottom:4px}
.shelf .sub{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.slot{padding:12px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.slot .g{font-size:32px}
.slot .gname{font-size:11.5px;font-weight:700;line-height:1.25}
.slot.rar-rare{background:var(--teal-tint)}
.slot.rar-epic{background:var(--gold-tint);box-shadow:3px 3px 0 var(--ink),inset 0 0 0 2px var(--gold)}
.slot.empty-slot{border-style:dashed;box-shadow:none;color:var(--ink-soft);background:transparent}
.actionsbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.reqlist{margin-top:26px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(51,48,43,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:520px;width:100%;padding:26px;max-height:86vh;overflow:auto}
.modal h2{font-size:22px;margin-bottom:12px}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toastwrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{border:var(--bd);border-radius:12px;background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
/* gift burst */
.burst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:150;pointer-events:none}
.burst .box{font-size:110px;animation:boxShake .5s ease,boxPop .45s ease .5s forwards}
.burst .gift{font-size:130px;animation:giftIn .6s cubic-bezier(.2,1.6,.4,1) .75s forwards;opacity:0;position:absolute}
.burst .conf{position:absolute;width:14px;height:14px;border:2px solid var(--ink);animation:confFall 1.1s ease-in .8s forwards;opacity:0}
@keyframes boxShake{0%,100%{rotate:0deg}25%{rotate:-9deg}75%{rotate:9deg}}
@keyframes boxPop{to{scale:1.9;opacity:0}}
@keyframes giftIn{from{opacity:0;scale:.2;rotate:-14deg}to{opacity:1;scale:1;rotate:0deg}}
@keyframes confFall{from{opacity:1;translate:0 0;rotate:0deg}to{opacity:0;translate:0 42vh;rotate:340deg}}
/* level up */
.lvlup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:160;background:rgba(51,48,43,.5)}
.lvlup .card{padding:38px;text-align:center;animation:giftIn .5s cubic-bezier(.2,1.6,.4,1)}
.lvlup .medal{font-size:70px;display:block}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* responsive */
@media (max-width:880px){

  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;border-right:none;border-top:var(--bd);padding:6px 8px;z-index:60;overflow-x:auto}
  .rail .logo,.rail .foot{display:none}
  .rail a.tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;justify-content:center}
  .main{padding:18px 14px 110px}
  .roomhead{grid-template-columns:1fr;text-align:center}
  .roomhead .bigav{margin:0 auto}
  .podium{grid-template-columns:1fr}
}
/* ================================================================
   Gifted Scholars — studio landing (warm editorial system)
   ground #E7E3DA · secondary #DCD7CB · ink #1A1917 · pigment #9B3418
   Instrument Serif (display) · Azeret Mono (labels/data) · radius 0
   ================================================================ */
.gs-page{
  --ground:#E7E3DA; --ground-2:#DCD7CB; --ink:#1A1917; --ink-2:#4A4741;
  --muted:#6E6A61; --pigment:#9B3418; --hair:rgba(26,25,23,.16);
  --serif:"Instrument Serif","Songti SC","STSong","Noto Serif SC",serif;
  --mono:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,"PingFang SC","Microsoft YaHei",monospace;
  background:var(--ground); color:var(--ink);
  font-family:var(--mono); font-size:12.5px; line-height:1.6;
  min-height:100svh; position:relative;
}
.gs-page ::selection{background:var(--pigment);color:var(--ground)}
.gs-page a{color:inherit}
.gs-page h1,.gs-page h2,.gs-page h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.05}
.gs-page .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pigment)}
.gs-page .it{font-style:italic;color:var(--pigment)}
html[lang="zh"] .gs-page .it{font-style:normal}

/* ---------- nav ---------- */
.gsnav{position:fixed;top:0;left:0;right:0;height:60px;z-index:60;
  display:flex;align-items:center;gap:26px;padding:0 clamp(16px,3.4vw,48px);
  background:rgba(231,227,218,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair)}
.gsnav .brand{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.gsnav .brand i{font-style:normal;color:var(--pigment)}
.gsnav .links{display:flex;gap:clamp(14px,2vw,26px);margin-left:auto;align-items:center}
.gsnav .links a{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  text-decoration:none;color:var(--ink);padding:4px 0;border-bottom:1px solid transparent;transition:border-color .18s ease,color .18s ease}
.gsnav .links a:hover{border-bottom-color:var(--pigment);color:var(--pigment)}
.gsnav .sqbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;
  padding:9px 14px;cursor:pointer;transition:background .18s ease,color .18s ease}
.gsnav .sqbtn:hover{background:var(--ink);color:var(--ground)}

/* ---------- hero ---------- */
.gshero{position:relative;margin-top:60px;min-height:calc(100svh - 60px);
  background:var(--ground-2);overflow:clip;isolation:isolate}
.gshero .copystack{position:relative;z-index:5;max-width:44vw;padding:clamp(28px,6vh,72px) 0 clamp(28px,6vh,72px) clamp(16px,3.4vw,48px)}
.gshero .eyebrow{display:block;margin-bottom:clamp(14px,2.4vh,26px)}
.gshero h1{font-size:clamp(30px,4vw,56px);max-width:20ch}
.gshero h1 .it{display:inline}
.gshero .lede{margin-top:clamp(14px,2.2vh,24px);max-width:46ch;color:var(--ink-2)}
.gshero .ctas{display:flex;gap:12px;margin-top:clamp(18px,3vh,32px);flex-wrap:wrap}
.gsbtn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;
  border:1px solid var(--ink);border-radius:0;padding:12px 18px;background:transparent;color:var(--ink);
  cursor:pointer;transition:background .18s ease,color .18s ease}
.gsbtn:hover{background:var(--ink);color:var(--ground)}
.gsbtn.pig{background:var(--pigment);border-color:var(--pigment);color:#F4EFE6}
.gsbtn.pig:hover{background:var(--ink);border-color:var(--ink)}
.gshero .corner-cap{position:absolute;left:clamp(16px,3.4vw,48px);bottom:clamp(14px,2.6vh,26px);
  z-index:5;font-size:10.5px;letter-spacing:.08em;color:var(--muted);max-width:52ch}

/* split wordmark: two stacked lines bracket the subject */
.gswm{position:absolute;inset:0;z-index:1;pointer-events:none}
.wm-line{position:absolute;right:clamp(12px,3vw,44px);font-family:var(--serif);font-weight:400;
  font-size:clamp(74px,17.5vw,258px);line-height:.82;letter-spacing:-.015em;color:var(--ink);white-space:nowrap}
.wm-top{top:clamp(28px,7vh,72px);z-index:3}
.wm-bot{bottom:clamp(28px,7vh,72px);z-index:1}
.gshero .subject{position:absolute;z-index:2;right:clamp(150px,24vw,430px);bottom:calc(50% - clamp(150px,26vh,280px));
  height:clamp(300px,52vh,560px);width:auto;max-width:60vw;
  filter:drop-shadow(0 22px 26px rgba(26,25,23,.18))}
.gshero .subject svg{height:100%;width:auto;display:block}
/* scroll-bound separation (custom prop --wp set from JS, 0..1).
   Selectors are boosted past the reveal grammar below (.rv.in would
   otherwise override transform at equal specificity). */
html.gs-motion .gs-page .gshero .wm-top{transform:translate3d(0,calc(var(--wp,0)*-20vh),0)}
html.gs-motion .gs-page .gshero .wm-bot{transform:translate3d(0,calc(var(--wp,0)*20vh),0)}
html.gs-motion .gs-page .gshero .subject{transform:translate3d(0,calc(var(--wp,0)*-24vh),0) scale(calc(1 + var(--wp,0)*.06))}

/* ---------- section shell ---------- */
.gsec{padding:clamp(56px,11vh,130px) clamp(16px,3.4vw,48px);border-top:1px solid var(--hair);position:relative}
.gsec .eyebrow{display:block;margin-bottom:14px}
.gsec h2{font-size:clamp(26px,3.2vw,44px);max-width:24ch}
.gsec .seclede{margin-top:14px;max-width:58ch;color:var(--ink-2)}

/* ---------- fig 01 · drawing ---------- */
.gsdraw{display:grid;grid-template-columns:minmax(300px,5fr) minmax(340px,7fr);gap:clamp(24px,4vw,64px);align-items:start}
.gsdraw .dl{margin-top:clamp(18px,3vh,30px);border-top:1px solid var(--hair)}
.gsdraw .dl>div{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.gsdraw .dl dt{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--pigment)}
.gsdraw .dl dd{color:var(--ink-2)}
.gsdraw .dl .val{font-size:11.5px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.figwrap{border:1px solid var(--hair);background:var(--ground);padding:clamp(10px,1.6vw,22px)}
.figwrap svg{display:block;width:100%;height:auto}
.figwrap .fignote{margin-top:10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- fig 02 · pinned study ---------- */
.gsstudy{height:340vh;border-top:1px solid var(--hair)}
.gsstudy .stage{position:sticky;top:60px;height:calc(100svh - 60px);overflow:hidden;
  display:flex;flex-direction:column;padding:clamp(20px,4vh,44px) clamp(16px,3.4vw,48px)}
.gsstudy h2{max-width:22ch}
.gsstudy .arcbox{position:relative;flex:1;margin-top:8px}
.gsstudy .arcbox svg{position:absolute;inset:0;width:100%;height:100%}
.gsstudy .arcbox path{fill:none;stroke:var(--ink);stroke-width:1.25;vector-effect:non-scaling-stroke;stroke-dasharray:3 4;opacity:.55}
.gsstudy .stage .subject{position:absolute;right:2%;top:2%;height:clamp(110px,20vh,190px);width:auto;
  filter:drop-shadow(0 12px 14px rgba(26,25,23,.16))}
.gsstudy .stage .subject svg{height:100%;width:auto}
.gsstudy .marker{position:absolute;width:13px;height:13px;background:var(--pigment);border-radius:0;
  transform:translate(-50%,-50%);z-index:3}
.gsstudy .marker::after{content:"";position:absolute;inset:-7px;border:1px solid var(--pigment);opacity:.4}
.gsstudy .readouts{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hair);margin-top:10px}
.gsstudy .readouts>div{padding:14px 12px 4px;border-right:1px solid var(--hair)}
.gsstudy .readouts>div:last-child{border-right:none}
.gsstudy .readouts .k{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.gsstudy .readouts .v{display:block;font-size:clamp(19px,2vw,30px);letter-spacing:-.01em;color:var(--ink);
  font-family:var(--serif);font-variant-numeric:tabular-nums;line-height:1.15}
.gsstudy .modelnote{margin-top:10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- practice rows ---------- */
.gsmat .rows{margin-top:clamp(18px,3vh,30px);border-top:1px solid var(--hair)}
.gsmat .row{display:grid;grid-template-columns:110px 1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.gsmat .row .k{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--pigment)}
.gsmat .row .d{color:var(--ink-2);max-width:64ch}
.gsmat .row .c{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.gsmat .pair{display:grid;grid-template-columns:minmax(280px,6fr) minmax(260px,5fr);gap:clamp(24px,4vw,64px);margin-top:clamp(26px,4.5vh,48px)}
.gsmat .pair h3{font-size:clamp(20px,2.2vw,30px);max-width:22ch}
.gsmat .pair p{margin-top:12px;color:var(--ink-2);max-width:56ch}
.gsmat .pair .data{border-top:1px solid var(--hair)}
.gsmat .pair .data>div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:11.5px}
.gsmat .pair .data .k{letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- work table ---------- */
.gstable .tbl{width:100%;border-collapse:collapse;margin-top:clamp(18px,3vh,30px)}
.gstable th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--ink)}
.gstable td{padding:15px 12px 15px 0;border-bottom:1px solid var(--hair);vertical-align:baseline}
.gstable td.name{font-family:var(--serif);font-size:clamp(15px,1.5vw,21px);letter-spacing:-.01em}
.gstable td,.gstable td a{font-size:11.5px;color:var(--ink-2)}
.gstable td.enter a{color:var(--pigment);text-decoration:none;border-bottom:1px solid transparent;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
.gstable td.enter a:hover{border-bottom-color:var(--pigment)}
.gstable tr:hover td{background:rgba(220,215,203,.5)}

/* ---------- close ---------- */
.gsclose{padding:clamp(56px,11vh,130px) clamp(16px,3.4vw,48px) 0;border-top:1px solid var(--hair);overflow:hidden}
.gsclose h2{font-size:clamp(30px,4vw,56px);max-width:20ch}
.gsclose .fine{margin-top:16px;font-size:11px;letter-spacing:.06em;color:var(--muted);max-width:72ch}
.gsclose .ctas{display:flex;justify-content:space-between;gap:12px;margin-top:clamp(22px,4vh,40px);flex-wrap:wrap}
.gsclose .strip{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--hair);
  margin-top:clamp(26px,5vh,52px);padding:14px 0;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.gsclose .endwm{font-family:var(--serif);font-weight:400;font-size:clamp(80px,20vw,300px);line-height:.82;
  letter-spacing:-.015em;white-space:nowrap;text-align:center;transform:translateY(.17em);margin-top:clamp(8px,2vh,20px);color:var(--ink)}

/* ---------- reveal grammar (motion only when allowed) ---------- */
html.gs-motion .rv{opacity:0;transform:translateY(20px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.6,.2,1);transition-delay:var(--rd,0s)}
html.gs-motion .rv.in{opacity:1;transform:none}
html.gs-motion [data-stagger]>.rv{--rd:calc(var(--si,0)*.07s)}
/* scroll-owned elements: transform belongs to --wp (no transition lag on
   it); their entrance is opacity-only */
html.gs-motion .gs-page .gshero .wm-top,
html.gs-motion .gs-page .gshero .wm-bot,
html.gs-motion .gs-page .gshero .subject{transition:opacity .8s ease}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .gshero .copystack{max-width:60vw}
  .gswm .wm-line{font-size:clamp(64px,15vw,160px)}
  .gshero .subject{right:clamp(90px,18vw,240px);height:clamp(240px,42vh,420px)}
  .gsdraw,.gsmat .pair{grid-template-columns:1fr}
  .gsstudy .readouts{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:700px){
  .gsnav{gap:14px;padding:0 16px}
  .gsnav .links a{letter-spacing:.12em}
  .gsnav .links .xtra{display:none}
  .gshero .copystack{max-width:100%;padding-top:26vh}
  .gswm .wm-line{right:16px;font-size:clamp(56px,19vw,96px)}
  .wm-top{top:9vh}.wm-bot{bottom:30vh}
  .gshero .subject{right:auto;left:50%;margin-left:calc(clamp(200px,30vh,260px)*-.5);bottom:auto;top:44vh;height:clamp(200px,30vh,260px)}
  html.gs-motion .gs-page .gshero .subject{transform:translate3d(0,calc(var(--wp,0)*-18vh),0) scale(calc(1 + var(--wp,0)*.05))}
  .gshero .corner-cap{position:static;margin-top:14px;max-width:100%}
  .gsdraw .dl>div{grid-template-columns:84px 1fr;grid-auto-rows:auto}
  .gsdraw .dl .val{grid-column:2}
  .gsmat .row{grid-template-columns:84px 1fr;grid-auto-rows:auto}
  .gsmat .row .c{grid-column:2}
  .gsstudy{height:300vh}
  .gsstudy .readouts{grid-template-columns:repeat(2,1fr)}
  .gsstudy .readouts>div{border-bottom:1px solid var(--hair)}
  .gsstudy .readouts>div:nth-child(2n){border-right:none}
  .gstable .tbl,.gstable .tbl tbody,.gstable .tbl tr,.gstable .tbl td{display:block}
  .gstable .tbl thead{display:none}
  .gstable .tbl tr{border-bottom:1px solid var(--hair);padding:12px 0}
  .gstable .tbl td{border-bottom:none;padding:3px 0}
  .gstable .tbl td.name{font-size:19px;margin-bottom:4px}
  .gstable .tbl td::before{content:attr(data-k);display:inline-block;width:86px;
    font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .gsclose .ctas{flex-direction:column}
  .gsclose .ctas .gsbtn{justify-content:center}
}

</style>

const HUES = [12,45,95,150,185,210,260,300,330];

function hueOf(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%997;return HUES[h%HUES.length];}
function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString(LOCALE(),{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"});}
function weekStart(ts,back){const d=new Date(ts);const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day-(back||0)*7);return d.getTime();}

/* ---- derived ledgers ---- */
function netOf(st,fromTs){let n=0;for(const r of S.records){if(r.undone)continue;if(fromTs&&r.ts<fromTs)continue;if(r.studentIds.includes(st.id))n+=r.value;}return n;}
function growthOf(st){return netOf(st);}
function spentOf(st){let sp=0;for(const q of S.requests){if(q.status!=="approved")continue;if(q.studentId!==st.id)continue;sp+=q.cost;}return sp;}
function walletOf(st){return Math.max(0,growthOf(st)-spentOf(st)-(S.boxSpent[st.id]||0));}
function levelOf(g){let i=0;for(let k=0;k<LEVELS.length;k++){if(g>=LEVELS[k].min)i=k;}return i;}
function lvlProgress(g){const i=levelOf(g);if(i>=LEVELS.length-1)return {i,pct:100,next:null};const a=LEVELS[i].min,b=LEVELS[i+1].min;return {i,pct:Math.min(100,Math.round(((g-a)/(b-a))*100)),next:LEVELS[i+1]};}
function collectionOf(id){return S.collection[id]||[];}

/* ---- persistence ---- */
function save(){localStorage.setItem(LS_KEY,JSON.stringify(S));}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){S=JSON.parse(raw);if(S&&S.students&&S.rules&&S.gifts&&S.records)return true;}}catch(e){}
  return false;
}
function seed(){
  // deterministic demo history so leaderboards and shelves have shape
  let rngState=42;const rng=()=>{rngState=(rngState*1103515245+12345)%2147483648;return rngState/2147483648;};
  S={version:1,
    settings:{className:"Class 4B",schoolName:"Maple Grove Primary",teacher:"Ms. Rivera",motion:"auto"},
    rules:DEFAULT_RULES.map(r=>({...r})),
    gifts:DEFAULT_GIFTS.map(g=>({...g})),
    students:[],records:[],requests:[],collection:{},boxSpent:{}};
  SEED_STUDENTS.forEach((n,i)=>S.students.push({id:"s"+(i+1),name:n,hue:HUES[i%HUES.length]}));
  const now=Date.now(),day=864e5;
  for(let d=9;d>=0;d--){                       // ten school days of history
    const nEv=6+Math.floor(rng()*8);
    for(let e=0;e<nEv;e++){
      const rule=S.rules[Math.floor(rng()*S.rules.length)];
      const howMany=1+Math.floor(rng()*3);
      const picked=[];
      while(picked.length<howMany){const st=S.students[Math.floor(rng()*S.students.length)];if(!picked.includes(st.id))picked.push(st.id);}
      S.records.push({id:uid(),ts:now-d*day-Math.floor(rng()*6)*36e5,studentIds:picked,ruleId:rule.id,ruleLabel:(LANG==="zh"&&rule.zh?rule.zh:rule.label)+" "+rule.icon,value:rule.value,undone:false});
    }
  }
  const gifters=[S.students[2],S.students[5],S.students[8],S.students[11],S.students[14]];
  gifters.forEach((st,i)=>{
    const g=S.gifts[i%3];
    S.requests.push({id:uid(),studentId:st.id,itemId:g.id,itemLabel:g.emoji+" "+g.name,cost:g.price,status:"approved",note:"",ts:now-(i+2)*day,decidedTs:now-(i+2)*day+36e5});
    S.collection[st.id]=S.collection[st.id]||[];
    S.collection[st.id].push({name:g.name,emoji:g.emoji,rar:"common",source:"shop",ts:now-(i+2)*day});
  });
  S.collection[S.students[4].id]=[{name:"Unicorn",zh:"独角兽",emoji:"🦄",rar:"rare",source:"box",ts:now-2*day}];
  S.records.sort((a,b)=>b.ts-a.ts);
  save();
}

/* ---- mutations ---- */
function byId(id){return S.students.find(s=>s.id===id);}
function giftById(id){return S.gifts.find(g=>g.id===id);}
function applyRule(rule,ids){
  const prev={};ids.forEach(id=>prev[id]=levelOf(growthOf(byId(id))));
  S.records.unshift({id:uid(),ts:Date.now(),studentIds:[...ids],ruleId:rule.id,ruleLabel:(LANG==="zh"&&rule.zh?rule.zh:rule.label)+" "+rule.icon,value:rule.value,undone:false});
  save();
  ids.forEach(id=>{const now=lvlProgress(growthOf(byId(id))).i;if(now>prev[id])queueLevelUp(byId(id),now);});
}
function undoRecord(rec){rec.undone=true;save();}
function requestGift(stId,gift){
  S.requests.unshift({id:uid(),studentId:stId,itemId:gift.id,itemLabel:gift.emoji+" "+(LANG==="zh"&&gift.zh?gift.zh:gift.name),cost:gift.price,status:"pending",note:"",ts:Date.now()});
  save();
}
function decide(req,ok){
  if(req.status!=="pending")return;
  if(ok){
    req.status="approved";req.decidedTs=Date.now();
    const g=giftById(req.itemId);
    if(g){g.stock=(g.stock==null)?null:g.stock-1;S.collection[req.studentId]=S.collection[req.studentId]||[];S.collection[req.studentId].push({name:(LANG==="zh"&&g.zh?g.zh:g.name),emoji:g.emoji,rar:"common",source:"shop",ts:Date.now()});}
  }else{req.status="declined";req.decidedTs=Date.now();}
  save();
}
function openBox(stId){
  const st=byId(stId);
  if(walletOf(st)<BOX_PRICE)return null;
  const roll=Math.random();
  const pool=roll<.6?BOX_POOL.filter(x=>x.rar==="common"):roll<.9?BOX_POOL.filter(x=>x.rar==="rare"):BOX_POOL.filter(x=>x.rar==="epic");
  const won=pool[Math.floor(Math.random()*pool.length)];
  S.boxSpent[stId]=(S.boxSpent[stId]||0)+BOX_PRICE;
  S.collection[stId]=S.collection[stId]||[];
  S.collection[stId].push({...won,source:"box",ts:Date.now()});
  save();return won;
}

/* ============ toasts / overlays ============ */
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";},1900);

}
function applyMotion(){
  const m=(S.settings&&S.settings.motion)||"auto";
  const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

}

function closeOverlays(){$("#modals").innerHTML="";$$(".burst,.lvlup").forEach(e=>e.remove());}
function modal(html){

let levelUpQueue=[];
function queueLevelUp(st,lv){levelUpQueue.push({st,lv});}
function flushLevelUps(){
  if(!levelUpQueue.length)return;
  const {st,lv}=levelUpQueue.shift();
  const L=LEVELS[lv];
  const el=document.createElement("div");el.className="lvlup";
  el.innerHTML='<div class="card stk"><span class="medal">'+L.badge+'</span><h2 style="font-family:var(--font-round)">Level '+(lv+1)+'!</h2><p style="margin-top:6px"><b>'+esc(st.name)+'</b> reached <b>'+esc(nm(L))+'</b></p><div class="btns" style="justify-content:center"><button class="btn gold" onclick="this.closest(\'.lvlup\').remove();flushLevelUps()">${t("celebrate")}</button></div></div>';
  el.addEventListener("click",e=>{if(e.target===el){el.remove();flushLevelUps();}});
  document.body.appendChild(el);
}
function giftBurst(won,after){
  const el=document.createElement("div");el.className="burst";
  const cols=["#E9A93D","#186F65","#D95A3F","#FBF0DA"];
  let conf="";for(let i=0;i<16;i++){const x=(Math.random()*60-30),d=(Math.random()*.3);conf+='<i class="conf" style="left:calc(50% + '+x+'px);top:38%;background:'+cols[i%4]+';animation-delay:'+(0.8+d)+'s"></i>';}
  el.innerHTML='<div class="box">🎁</div><div class="gift">'+won.emoji+'</div>'+conf;
  el.addEventListener("click",()=>{el.remove();if(after)after();});
  document.body.appendChild(el);
  setTimeout(()=>{el.remove();if(after)after();},2600);
}

  const q=S.requests.find(x=>x.id===id);if(!q||q.status!=="pending")return;
  if(ok){
    const st=byId(q.studentId),g=giftById(q.itemId);
    if(!st||!g){toast("This gift no longer exists");return;}
    if(g.active===false){toast(t("offShelf2"));return;}
    if(g.stock!=null&&g.stock<=0){toast("Sold out: raise the stock to approve.");return;}
    if(g.per&&approvedCountFor(st.id,g.id)>=g.per){toast(st.name+" hit the limit of "+g.per+" for this gift");return;}
    if(walletOf(st)<q.cost){toast(st.name+" only has ★ "+walletOf(st)+" now. Ratings first, then approve.");return;}
  }
  decide(q,ok);
  toast(ok?("Granted: "+q.itemLabel):("Declined: "+q.itemLabel));
  viewShop();
}

function saveCls(){
  S.settings.className=$("#clsName").value.trim()||S.settings.className;

  S.settings.teacher=$("#tchName").value.trim()||S.settings.teacher;
  save();toast(t("classSaved"));

function editRule(id,key,val){
  const r=S.rules.find(x=>x.id===id);if(!r)return;
  r[key]=val;save();
  if(key!=="active")toast("Rule updated");
}
function addRule(){
  S.rules.push({id:uid(),icon:"✨",label:t("newRule"),value:1,active:true});
  save();viewSettings();
}
function delRule(id){
  const used=S.records.some(r=>r.ruleId===id);
  const del=()=>{S.rules=S.rules.filter(r=>r.id!==id);save();viewSettings();toast("Rule deleted");};
  if(used){confirmModal(t("delRule"),"Past records that used it keep their values for the log, but it disappears from the rating screen.",del);}
  else del();
}
function addStudent(){
  const inp=$("#newStu");const name=inp.value.trim();
  if(!name){toast("Type a name first");return;}
  S.students.push({id:uid(),name,hue:hueOf(name)});
  inp.value="";save();viewSettings();toast(name+" added");
}
function delStudent(id){
  const st=byId(id);if(!st)return;
  confirmModal(t("remove")+st.name+"?","Their ratings stay in the records log, but their gift room and shelf data will be removed.",()=>{
    S.students=S.students.filter(s=>s.id!==id);
    delete S.collection[id];sel.delete(id);
    save();viewSettings();toast(st.name+" removed");
  });
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});

  a.download="gifted-scholars-"+S.settings.className.replace(/\s+/g,"-").toLowerCase()+".json";
  a.click();URL.revokeObjectURL(a.href);

/* ---------- fig 01 · the level curve, drawn strictly to scale ----------
   Scale: x — 64 px per level · y — 2.2 px per point. Thresholds come
   straight from LEVELS[]; the fignote repeats the same numbers. */
function figureSVG(){
  const X0=70, DX=64, Y0=392, SY=2.2, TOP=40, LEFT=46, RIGHT=700;
  const Y=v=>Y0-v*SY;
  let s='';
  for(let p=0;p<=160;p+=40){
    s+='<line x1="'+LEFT+'" y1="'+Y(p)+'" x2="'+RIGHT+'" y2="'+Y(p)+'" stroke="rgba(26,25,23,.16)" stroke-width="1"/>'
      +'<text x="'+(LEFT-8)+'" y="'+(Y(p)+3.5)+'" text-anchor="end" class="ax">'+p+'</text>';
  }
  for(let i=0;i<10;i++){
    const x=X0+i*DX;
    s+='<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+Y0+'" stroke="rgba(26,25,23,.09)" stroke-width="1"/>'
      +'<text x="'+x+'" y="'+(Y0+20)+'" text-anchor="middle" class="ax">L'+(i+1)+'</text>';
  }
  s+='<line x1="'+LEFT+'" y1="'+Y0+'" x2="'+RIGHT+'" y2="'+Y0+'" stroke="#1A1917" stroke-width="1.4"/>';
  s+='<polyline points="'+LEVELS.map((l,i)=>(X0+i*DX)+','+Y(l.min)).join(' ')
    +'" fill="none" stroke="#1A1917" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  LEVELS.forEach((l,i)=>{ s+='<circle cx="'+(X0+i*DX)+'" cy="'+Y(l.min)+'" r="3" fill="#9B3418"/>'; });
  const leader=(i,dy,left)=>{
    const l=LEVELS[i], x=X0+i*DX, y=Y(l.min);
    return left
      ? '<line x1="'+x+'" y1="'+y+'" x2="'+(x-26)+'" y2="'+(y-dy)+'" stroke="#9B3418" stroke-width="1"/>'
        +'<text x="'+(x-31)+'" y="'+(y-dy+3.5)+'" text-anchor="end" class="lb">L'+(i+1)+' · '+l.min+'</text>'
      : '<line x1="'+x+'" y1="'+y+'" x2="'+(x+26)+'" y2="'+(y-dy)+'" stroke="#9B3418" stroke-width="1"/>'
        +'<text x="'+(x+31)+'" y="'+(y-dy+3.5)+'" class="lb">L'+(i+1)+' · '+l.min+'</text>';
  };
  s+=leader(0,30,false)+leader(4,34,false)+leader(9,30,true);
  return '<svg viewBox="0 0 760 470" role="img" aria-label="Level curve, drawn to scale">'
    +'<style>.ax{font:10.5px "Azeret Mono",monospace;fill:#6E6A61;letter-spacing:.1em}'
    +'.lb{font:10.5px "Azeret Mono",monospace;fill:#9B3418;letter-spacing:.12em}</style>'+s+'</svg>';
}

/* ---------- fig 02 · one week, computed ----------
   THE MODEL (stated once, in the copy): five school days, "answered well"
   (+2) each day.  d = 5·scroll · pts = 2d · level & progress from LEVELS[].
   The marker's arc and the printed readouts are the same calculation. */
function studyModel(p){
  const d=Math.min(5,Math.floor(p*5.0001));
  const pts=2*d;
  let li=0; for(let i=0;i<LEVELS.length;i++){ if(pts>=LEVELS[i].min) li=i; }
  const cur=LEVELS[li], next=LEVELS[li+1];
  const into=next ? (pts-cur.min)/(next.min-cur.min) : 1;
  return {day:d, pts:pts, level:li+1, into:Math.round(into*100), stars:pts};
}
const ARC={p0:[12,80], p1:[46,30], p2:[88,10]};
function arcPoint(t){
  const u=1-t;
  return [ u*u*ARC.p0[0]+2*u*t*ARC.p1[0]+t*t*ARC.p2[0],
           u*u*ARC.p0[1]+2*u*t*ARC.p1[1]+t*t*ARC.p2[1] ];
}
function setReadouts(m){
  const set=(id,v)=>{const n=document.getElementById(id); if(n&&n.textContent!==v)n.textContent=v;};
  set('rd-day',String(m.day)); set('rd-pts','+'+m.pts); set('rd-lvl','L'+m.level);
  set('rd-into',m.into+'%'); set('rd-stars',m.stars+' ★');
}

/* ---------- studio controller: reveals + scroll-bound layers ---------- */
function initStudio(){
  const root=document.querySelector('.gs-page'); if(!root) return;
  const motion=document.documentElement.classList.contains('gs-motion')
    && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hero=document.querySelector('.gshero');
  const study=document.querySelector('.gsstudy');
  const marker=document.getElementById('gs-marker');
  /* above-fold pieces reveal on rAF — never observed (they can sit inside a
     negative root margin on short viewports and would never fire) */
  requestAnimationFrame(()=>{ document.querySelectorAll('.rv-raf').forEach(n=>n.classList.add('in')); });
  /* stagger indices */
  document.querySelectorAll('[data-stagger]').forEach(g=>{
    g.querySelectorAll('.rv').forEach((n,i)=>n.style.setProperty('--si',i));
  });
  /* in-view reveals */
  let io=null;
  if(motion && 'IntersectionObserver' in window){
    io=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{rootMargin:'0px 0px -8% 0px',threshold:.12});
    document.querySelectorAll('.rv:not(.rv-raf)').forEach(n=>io.observe(n));
  }else{
    document.querySelectorAll('.rv').forEach(n=>n.classList.add('in'));
  }
  /* scroll-position-bound layer: split wordmark + computed study */
  let raf=0;
  const onScroll=()=>{
    if(raf) return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      if(hero){
        const r=hero.getBoundingClientRect();
        const p=Math.max(0,Math.min(1,-r.top/(r.height*.9)));
        hero.style.setProperty('--wp',p.toFixed(4));
      }
      if(study&&marker){
        const r=study.getBoundingClientRect();
        const total=r.height-window.innerHeight;
        const p=Math.max(0,Math.min(1,-r.top/(total||1)));
        const pt=arcPoint(p);
        marker.style.left=pt[0]+'%'; marker.style.top=pt[1]+'%';
        setReadouts(studyModel(p));
      }
    });
  };
  if(motion){
    window.addEventListener('scroll',onScroll,{passive:true});
    window.addEventListener('resize',onScroll,{passive:true});
    onScroll();
    window._gsLandCleanup=()=>{
      window.removeEventListener('scroll',onScroll);
      window.removeEventListener('resize',onScroll);
      if(io) io.disconnect();
      if(raf) cancelAnimationFrame(raf);
    };
  }else{
    /* static final states: the completed week, wordmark fully parted */
    if(hero) hero.style.setProperty('--wp','1');
    if(marker){ const pt=arcPoint(1); marker.style.left=pt[0]+'%'; marker.style.top=pt[1]+'%'; }
    setReadouts(studyModel(1));
    window._gsLandCleanup=null;
  }
}

/* ---------- open a gift room by student name ---------- */
function openRoomPicker(){
  modal(`<div class="card stk" style="max-width:420px"><h2 style="font-family:var(--font-round)">Open a gift room</h2>
  <p style="margin:8px 0 14px;color:var(--ink-soft)">${t("nameHint")}</p>
  <input id="rp-name" placeholder="${t("yourName")}" style="width:100%;padding:12px 14px;border:var(--bd);border-radius:12px;font-size:16px" aria-label="${t("yourName")}">
  <div class="btns" style="margin-top:14px"><button class="btn ghost" onclick="closeOverlays()">Cancel</button><button class="btn primary" id="rp-go">${t("openMyRoom")}</button></div></div>`);
  const openIt=()=>{
    const q=($("#rp-name").value||"").trim().toLowerCase();
    if(!q){toast(t("typeFirst"));return;}
    const st=S.students.find(x=>x.name.toLowerCase()===q)||S.students.find(x=>x.name.toLowerCase().startsWith(q));
    if(!st){toast(t("noStudent") + $("#rp-name").value.trim() + t("noStudent2"));return;}
    go("#/room/"+st.id);
  };
  $("#rp-go").addEventListener("click",openIt);
  $("#rp-name").addEventListener("keydown",e=>{if(e.key==="Enter")openIt();});
  $("#rp-name").focus();
}
