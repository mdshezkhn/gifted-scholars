/* ============ tokens ============ */
:root{
  --paper:#F4F1E8; --paper-2:#ECE7D8; --ink:#15251C; --ink-soft:#5C6458;
  --teal:#186F65; --teal-deep:#0F4F48; --teal-tint:#E3EFEA;
  --gold:#E9A93D; --gold-tint:#FBF0DA;
  --coral:#C2402A; --coral-tint:#FBE7E1;
  --white:#FFFCF5;
  --radius:14px; --bd:2px solid var(--ink);
  --shadow:3px 3px 0 var(--ink);
  --font-round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Segoe UI",system-ui,-apple-system,,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-round);line-height:1.15;letter-spacing:-.01em}
a{color:var(--teal-deep)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ============ primitives ============ */
.stk{background:var(--white);border:var(--bd);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--bd);border-radius:12px;background:var(--white);color:var(--ink);padding:10px 18px;font-family:var(--font-round);font-weight:700;box-shadow:var(--shadow);min-height:44px;transition:transform .06s ease,box-shadow .06s ease;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--teal);color:var(--white)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:44px}
.btn.danger{background:var(--coral);color:var(--white)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.chip{border:var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--white);box-shadow:2px 2px 0 var(--ink);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.chip.plus{background:var(--teal-tint)}
.chip.minus{background:var(--coral-tint)}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--gold-tint)}
input[type=text],input[type=number],select,textarea{border:var(--bd);border-radius:10px;padding:8px 10px;background:var(--white);font:inherit;color:var(--ink);width:100%}
input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label{font-weight:700;font-size:14px}

/* ============ app shell ============ */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper-2);position:sticky;top:0;height:100vh}
.rail .logo{display:flex;align-items:center;gap:8px;font-family:var(--font-round);font-weight:800;text-decoration:none;color:var(--ink);padding:6px 8px 16px;font-size:17px}
.rail a.tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;border:2px solid transparent;min-height:44px}
.rail a.tab:hover{background:var(--white)}
.rail a.tab[aria-current=page]{background:var(--white);border:var(--bd);box-shadow:2px 2px 0 var(--ink)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink-soft);padding:8px}
.main{padding:26px 28px 90px;max-width:1120px;width:100%}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:28px;font-weight:800}
.pagehead .sub{color:var(--ink-soft);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs .chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* classroom */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{padding:14px;position:relative;cursor:pointer;background:var(--white)}
.card .pick{position:absolute;top:8px;right:8px;width:26px;height:26px;border:var(--bd);border-radius:8px;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.card.sel{background:var(--gold-tint)}
.card.sel .pick{background:var(--gold)}
.card .av{width:44px;height:44px;border-radius:50%;border:var(--bd);display:flex;align-items:center;justify-content:center;font-family:var(--font-round);font-weight:800;font-size:19px;margin-bottom:8px}
.card .nm{font-weight:800;font-size:15px}
.card .lv{font-size:12px;font-weight:700;color:var(--ink-soft)}
.card .pts{display:flex;gap:12px;margin-top:8px;font-family:var(--font-round)}
.card .net{font-weight:800;font-size:17px}
.card .net.neg{color:var(--coral)}
.card .wallet{font-size:13px;color:var(--ink-soft)}
.card .roomlink{position:absolute;bottom:10px;right:10px;font-size:13px;text-decoration:none;font-weight:700;padding:4px}
.float{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--font-round);font-weight:800;font-size:20px;pointer-events:none;animation:floatUp 1s ease-out forwards;z-index:5}
@keyframes floatUp{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -46px}}
.rail-legend{display:flex;gap:10px;flex-wrap:wrap}
.legend{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.legend b{color:var(--ink)}

/* records & lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.row .who{font-weight:700;font-size:14px;flex:1;min-width:180px}
.row .val{font-family:var(--font-round);font-weight:800;font-size:18px;min-width:52px;text-align:right}
.row .val.neg{color:var(--coral)}
.row .meta{font-size:12.5px;color:var(--ink-soft);min-width:150px}
.row.undone{opacity:.55}
.row.undone .who{text-decoration:line-through}
.empty{padding:34px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:34px;display:block;margin-bottom:8px}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item{padding:18px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .emoji{font-size:34px}
.item h3{font-size:16px}
.item .desc{font-size:13px;color:var(--ink-soft);flex:1}
.item .price{font-family:var(--font-round);font-weight:800;font-size:16px}
.item .row-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.off{opacity:.6}
.queue{margin-bottom:26px}
.reqrow{display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.reqrow .st-who{font-weight:800}
.reqrow .st-gift{flex:1;min-width:170px}
.pill{font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:7px;padding:1px 7px}
.pill.pending{background:var(--gold-tint)}
.pill.approved{background:var(--teal-tint)}
.pill.declined{background:var(--coral-tint)}

/* leaderboard */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.pod{padding:18px;text-align:center}
.pod .medal{font-size:34px}
.pod .nm{font-family:var(--font-round);font-weight:800;font-size:18px}
.pod .sc{font-size:14px;color:var(--ink-soft)}
.statline{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.stat{padding:12px 18px}
.stat .k{font-size:12px;font-weight:800;text-transform:none;color:var(--ink-soft)}
.stat .v{font-family:var(--font-round);font-weight:800;font-size:20px}

/* student room */
.room{max-width:900px;margin:0 auto;padding:26px 20px 80px}
.room .back{margin-bottom:18px}
.roomhead{padding:26px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--gold-tint)}
.roomhead .bigav{width:84px;height:84px;border-radius:50%;border:var(--bd);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--white)}
.roomhead h1{font-size:30px}
.lvl-bar{height:16px;border:var(--bd);border-radius:999px;background:var(--white);overflow:hidden;margin-top:8px;width:min(320px,100%)}
.lvl-bar i{display:block;height:100%;background:var(--gold);transition:width .5s ease}
.room .walletbox{font-family:var(--font-round);text-align:center}
.room .walletbox .v{font-size:30px;font-weight:800}
.shelf{margin-top:26px}
.shelf h2{font-size:20px;margin-bottom:4px}
.shelf .sub{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.slot{padding:12px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.slot .g{font-size:32px}
.slot .gname{font-size:11.5px;font-weight:700;line-height:1.25}
.slot.rar-rare{background:var(--teal-tint)}
.slot.rar-epic{background:var(--gold-tint);box-shadow:3px 3px 0 var(--ink),inset 0 0 0 2px var(--gold)}
.slot.empty-slot{border-style:dashed;box-shadow:none;color:var(--ink-soft);background:transparent}
.actionsbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.reqlist{margin-top:26px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(51,48,43,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:520px;width:100%;padding:26px;max-height:86vh;overflow:auto}
.modal h2{font-size:22px;margin-bottom:12px}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toastwrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{border:var(--bd);border-radius:12px;background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
/* gift burst */
.burst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:150;pointer-events:none}
.burst .box{font-size:110px;animation:boxShake .5s ease,boxPop .45s ease .5s forwards}
.burst .gift{font-size:130px;animation:giftIn .6s cubic-bezier(.2,1.6,.4,1) .75s forwards;opacity:0;position:absolute}
.burst .conf{position:absolute;width:14px;height:14px;border:2px solid var(--ink);animation:confFall 1.1s ease-in .8s forwards;opacity:0}
@keyframes boxShake{0%,100%{rotate:0deg}25%{rotate:-9deg}75%{rotate:9deg}}
@keyframes boxPop{to{scale:1.9;opacity:0}}
@keyframes giftIn{from{opacity:0;scale:.2;rotate:-14deg}to{opacity:1;scale:1;rotate:0deg}}
@keyframes confFall{from{opacity:1;translate:0 0;rotate:0deg}to{opacity:0;translate:0 42vh;rotate:340deg}}
/* level up */
.lvlup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:160;background:rgba(51,48,43,.5)}
.lvlup .card{padding:38px;text-align:center;animation:giftIn .5s cubic-bezier(.2,1.6,.4,1)}
.lvlup .medal{font-size:70px;display:block}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* responsive */
@media (max-width:880px){

  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;border-right:none;border-top:var(--bd);padding:6px 8px;z-index:60;overflow-x:auto}
  .rail .logo,.rail .foot{display:none}
  .rail a.tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;justify-content:center}
  .main{padding:18px 14px 110px}
  .roomhead{grid-template-columns:1fr;text-align:center}
  .roomhead .bigav{margin:0 auto}
  .podium{grid-template-columns:1fr}
}
/* ======================================================================
   Gifted Scholars — landing scene (Sprig motion system, namespaced gs-)
   Faithful adaptation of the supplied reference sprig.css (checkpoint
   b9635744). Necessary changes for this site: class names prefixed gs-
   (single file also contains the app UI), video/poster replaced by an
   original inline-SVG character with cursor-tracking pupils, wordmark is
   this brand's own mark. Geometry, tokens, curves, timings and breakpoints
   match the reference values.
   ====================================================================== */
:root{
  --gs-bg:#F4F1E8; --gs-ink:#15251C; --gs-pill:#FFFCF5; --gs-pill-hover:#E6EDDC;
  --gs-hover-green:#537342; --gs-leaf:#78956A; --gs-sparkle:#B39D71;
  --gs-burst-a:#718E60; --gs-burst-b:#AC9468;
  --gs-ease:cubic-bezier(.25,1,.4,1); --gs-spring:cubic-bezier(.22,1,.36,1);
  font-synthesis:none; color-scheme:light;
}
.gs-page{position:relative;min-height:100svh;padding-top:6.5vw;isolation:isolate;overflow:hidden;background:var(--gs-bg);color:var(--gs-ink)}
.gs-left{position:relative;margin-left:8.5vw;width:25vw;z-index:1}
.gs-pill{display:inline-flex;align-items:center;border-radius:100px;background:var(--gs-pill);padding:.39vw .72vw;min-height:1.9vw;font-size:clamp(12px,.88vw,17px);line-height:1.2;white-space:nowrap}
.gs-headline{font-family:"Epilogue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:900;font-size:clamp(20px,1.66vw,34px);line-height:1.2;letter-spacing:-.025em;margin:1.45vw 0 0}
.gs-topics{display:flex;flex-direction:column;align-items:flex-start;gap:.93vw;margin-top:1.3vw;font-size:clamp(14px,1.075vw,20px);line-height:1.35}
.gs-topics>a,.gs-topics>button{background:none;border:0;padding:0;color:inherit;font:inherit;line-height:inherit;cursor:pointer;text-align:left;text-decoration:none}
.gs-brand{position:absolute;top:6.6vw;left:50%;transform:translateX(-50%);width:30vw;z-index:1}
.gs-brand svg{width:100%;height:auto;display:block;overflow:visible}
.gs-right{position:absolute;right:6vw;top:6.5vw;width:21vw;z-index:1}
.gs-note{margin:1.05vw 0 0;font-size:clamp(11px,.78vw,15px);line-height:1.5;max-width:34ch}
.gs-socials{display:flex;align-items:center;gap:1.3vw;margin-top:1.45vw}
.gs-socials>span{display:flex;align-items:center;justify-content:center;width:clamp(22px,1.71vw,34px);height:clamp(22px,1.71vw,34px)}
.gs-socials svg{display:block;width:100%;height:100%}
.gs-scene{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--gs-bg)}
.gs-char{position:absolute;bottom:-1vw;left:50%;transform:translateX(-50%);width:min(46vw,720px);max-height:88vh}
.gs-credit{position:absolute;left:8.5vw;bottom:1.6vw;z-index:2;margin:0;max-width:20vw;font-size:clamp(10px,.75vw,14px);line-height:1.5;color:var(--gs-ink);opacity:.75}
.gs-credit a{color:inherit}
.gs-credit a:hover{color:var(--gs-hover-green)}

/* tablet (701-1000px) — reference overrides */
@media (min-width:701px) and (max-width:1000px){
  .gs-left{margin-left:6vw;width:28vw}
  .gs-right{right:4vw;width:28vw}
  .gs-brand{width:33vw}
  .gs-pill{padding:6px 9px;font-size:11px}
  .gs-headline{font-size:19px;margin-top:16px}
  .gs-topics{margin-top:17px;gap:11px}
  .gs-note{margin-top:13px;font-size:11px}
  .gs-socials{margin-top:17px;gap:15px}
  .gs-char{width:min(58vw,520px)}
}

/* mobile (<=700px) — normal flow: wordmark, left, right, character */
@media (max-width:700px){
  .gs-page{display:flex;flex-direction:column;gap:36px;min-height:100svh;padding:40px 24px 0}
  .gs-brand{position:static;order:0;transform:none;width:300px;max-width:78%;align-self:flex-start;margin:0 0 4px}
  .gs-left{order:1;margin:0;width:100%}
  .gs-pill{height:30px;min-height:30px;padding:6px 11px;font-size:14px}
  .gs-headline{font-size:clamp(22px,6.3vw,30px);line-height:1.25;margin-top:19px}
  .gs-topics{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:0;font-size:17px;line-height:1.4;margin-top:20px}
  .gs-topics>a,.gs-topics>button{display:flex;align-items:center;min-height:44px}
  .gs-right{position:static;order:2;width:100%}
  .gs-note{max-width:34ch;margin-top:16px;font-size:14px;line-height:1.5}
  .gs-socials{margin-top:20px;gap:18px}
  .gs-socials>span{width:44px;height:44px}
  .gs-socials svg{width:30px;height:30px}
  .gs-socials>span:first-child{margin-left:-7px}
  .gs-scene{position:relative;inset:auto;z-index:auto;order:3;flex:none;align-self:center;width:calc(100% + 48px);aspect-ratio:4/3;margin-top:-16px}
  .gs-char{bottom:0;width:min(100%,420px);max-height:none}
  .gs-credit{position:static;order:4;margin:0 0 18px;opacity:.8;font-size:12px}
}

/* entrance choreography (values per reference spec) */
.gs-line{display:block;overflow:hidden;padding-bottom:.055em;margin-bottom:-.055em}
.gs-line>span{display:block}
.gs-brand-reveal{transform-origin:50% 70%}
.gs-brand svg{transform-origin:50% 70%;transition:transform 280ms var(--gs-spring)}
.gs-brand svg .gs-brand-leaf{transform-box:fill-box;transform-origin:50% 100%}
.gs-pill{transition:transform 260ms var(--gs-spring),background-color 220ms ease}
.gs-topics>a>span,.gs-topics>button>span{display:inline-block;transition:transform 280ms var(--gs-spring),color 180ms ease}
.gs-socials svg{transition:transform 280ms var(--gs-spring)}
.gs-scene{transition:opacity 240ms var(--gs-ease)}

/* ambient botanical accents (supplied reference artwork paths) */
.gs-accents{position:absolute;inset:0;pointer-events:none}
.gs-bot{position:absolute;display:block;color:var(--gs-leaf);opacity:.52}
.gs-bot svg{display:block;width:100%;height:auto}
.gs-bot-a{width:30px;left:17%;top:64%}
.gs-bot-b{width:19px;left:26%;top:81%;color:var(--gs-sparkle)}
.gs-bot-c{width:35px;right:17%;top:54%}
.gs-bot-d{width:17px;right:24%;top:83%;color:var(--gs-sparkle)}

/* click / tap leaf bursts */
.gs-bursts{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.gs-bloom{position:absolute;width:0;height:0}
.gs-petal{position:absolute;left:-8px;top:-8px;width:17px;height:17px;color:var(--gs-burst-a);opacity:0}
.gs-petal:nth-child(even){color:var(--gs-burst-b);width:12px;height:12px}
.gs-petal svg{display:block;width:100%;height:100%}

  .gs-motion .gs-brand-reveal{animation:gs-brand-arrive 760ms var(--gs-spring) 100ms both}
  .gs-motion .gs-brand svg .gs-brand-leaf{animation:gs-leaf-wave 8s ease-in-out 1.1s infinite}
  .gs-motion .gs-left>.gs-pill{animation:gs-soft-arrive 560ms var(--gs-ease) 80ms backwards}
  .gs-motion .gs-right>.gs-pill{animation:gs-soft-arrive 560ms var(--gs-ease) 180ms backwards}
  .gs-motion .gs-line>span{animation:gs-line-arrive 680ms var(--gs-ease) 170ms both}
  .gs-motion .gs-line:nth-child(2)>span{animation-delay:250ms}
  .gs-motion .gs-right .gs-line>span{animation-delay:290ms}
  .gs-motion .gs-right .gs-line:nth-child(2)>span{animation-delay:370ms}
  .gs-motion .gs-topics>a,.gs-topics>button{animation:gs-soft-arrive 520ms var(--gs-ease) 360ms both}
  .gs-motion .gs-topics>:nth-child(2){animation-delay:430ms}
  .gs-motion .gs-topics>:nth-child(3){animation-delay:500ms}
  .gs-motion .gs-topics>:nth-child(4){animation-delay:570ms}
  .gs-motion .gs-note{animation:gs-soft-arrive 560ms var(--gs-ease) 490ms both}
  .gs-motion .gs-socials>span{animation:gs-icon-arrive 500ms var(--gs-spring) 570ms both}
  .gs-motion .gs-socials>span:nth-child(2){animation-delay:640ms}
  .gs-motion .gs-socials>span:nth-child(3){animation-delay:710ms}
  .gs-motion .gs-scene{animation:gs-scene-arrive 900ms ease-out both}
  .gs-motion .gs-bot-a{animation:gs-drift 9s ease-in-out infinite}
  .gs-motion .gs-bot-b{animation:gs-twinkle 7s ease-in-out 700ms infinite}
  .gs-motion .gs-bot-c{animation:gs-drift 10s ease-in-out -3s infinite reverse}
  .gs-motion .gs-bot-d{animation:gs-twinkle 8s ease-in-out -2s infinite}
  .gs-motion .gs-petal{animation:gs-petal-burst 950ms cubic-bezier(.2,.65,.3,1) var(--petal-delay) both}
@media (hover:hover) and (pointer:fine){
  .gs-motion .gs-brand:hover svg{transform:rotate(-2deg) scale(1.025)}
  .gs-motion .gs-pill:hover{transform:translateY(-2px) rotate(-1.2deg);background-color:var(--gs-pill-hover)}
  .gs-motion .gs-right .gs-pill:hover{transform:translateY(-2px) rotate(1.2deg)}
  .gs-motion .gs-topics>a:hover>span,.gs-topics>button:hover>span{transform:translateX(4px);color:var(--gs-hover-green)}
  .gs-motion .gs-socials>span:hover svg{transform:translateY(-3px) rotate(-5deg) scale(1.04)}
  .gs-motion .gs-socials>span:nth-child(2):hover svg{transform:translateY(-3px) rotate(5deg) scale(1.04)}
}
@media (max-width:700px){
  .gs-bot-a{width:24px;left:9%;top:39%}
  .gs-bot-b{width:13px;left:20%;top:82%}
  .gs-bot-c{width:23px;right:9%;top:20%}
  .gs-bot-d{width:14px;right:15%;top:76%}
}
@media (prefers-reduced-motion:reduce){
  .gs-brand-reveal,.gs-brand svg,.gs-brand svg .gs-brand-leaf,.gs-pill,
  .gs-line>span,.gs-topics>a,.gs-topics>button,.gs-topics>a>span,.gs-topics>button>span,
  .gs-note,.gs-socials>span,.gs-socials svg,.gs-scene,.gs-char{
    animation:none!important;transition:none!important;
  }
  .gs-accents,.gs-bursts{display:none}
}
@keyframes gs-soft-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes gs-line-arrive{from{opacity:0;transform:translateY(80%)}to{opacity:1;transform:translateY(0)}}
@keyframes gs-brand-arrive{from{opacity:0;transform:translateY(8px) rotate(-2deg) scale(.96)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}

@keyframes gs-scene-arrive{from{opacity:.45}to{opacity:1}}
@keyframes gs-leaf-wave{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes gs-drift{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes gs-twinkle{0%,100%{opacity:.4;transform:rotate(0) scale(.95)}50%{opacity:.6;transform:rotate(10deg) scale(1.04)}}
@keyframes gs-petal-burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.9)}15%{opacity:.85}70%{opacity:.4}100%{opacity:0;transform:translate(var(--petal-x),var(--petal-y)) rotate(var(--petal-turn)) scale(.55)}}

.gs-lang{position:fixed;right:22px;bottom:22px;z-index:60;background:#FFFCF5;color:#15251C;border:1px solid rgba(21,37,28,.14);border-radius:100px;padding:9px 18px;font-size:13px;letter-spacing:.02em;cursor:pointer;font-family:inherit;transition:background-color .22s ease,transform .26s cubic-bezier(.22,1,.36,1)}
@media(hover:hover) and (pointer:fine){.gs-lang:hover{background:#E6EDDC;transform:translateY(-2px)}}

const uid = () => "x"+Math.random().toString(36).slice(2,9);
const HUES = [12,45,95,150,185,210,260,300,330];

function hueOf(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%997;return HUES[h%HUES.length];}
function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString(LOCALE(),{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"});}
function weekStart(ts,back){const d=new Date(ts);const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day-(back||0)*7);return d.getTime();}

/* ---- derived ledgers ---- */
function netOf(st,fromTs){let n=0;for(const r of S.records){if(r.undone)continue;if(fromTs&&r.ts<fromTs)continue;if(r.studentIds.includes(st.id))n+=r.value;}return n;}
function growthOf(st){return netOf(st);}
function spentOf(st){let sp=0;for(const q of S.requests){if(q.status!=="approved")continue;if(q.studentId!==st.id)continue;sp+=q.cost;}return sp;}
function walletOf(st){return Math.max(0,growthOf(st)-spentOf(st)-(S.boxSpent[st.id]||0));}
function levelOf(g){let i=0;for(let k=0;k<LEVELS.length;k++){if(g>=LEVELS[k].min)i=k;}return i;}
function lvlProgress(g){const i=levelOf(g);if(i>=LEVELS.length-1)return {i,pct:100,next:null};const a=LEVELS[i].min,b=LEVELS[i+1].min;return {i,pct:Math.min(100,Math.round(((g-a)/(b-a))*100)),next:LEVELS[i+1]};}
function collectionOf(id){return S.collection[id]||[];}

/* ---- persistence ---- */
function save(){localStorage.setItem(LS_KEY,JSON.stringify(S));}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){S=JSON.parse(raw);if(S&&S.students&&S.rules&&S.gifts&&S.records)return true;}}catch(e){}
  return false;
}
function seed(){
  // deterministic demo history so leaderboards and shelves have shape
  let rngState=42;const rng=()=>{rngState=(rngState*1103515245+12345)%2147483648;return rngState/2147483648;};
  S={version:1,
    settings:{className:"Class 4B",schoolName:"Maple Grove Primary",teacher:"Ms. Rivera",motion:"auto"},
    rules:DEFAULT_RULES.map(r=>({...r})),
    gifts:DEFAULT_GIFTS.map(g=>({...g})),
    students:[],records:[],requests:[],collection:{},boxSpent:{}};
  SEED_STUDENTS.forEach((n,i)=>S.students.push({id:"s"+(i+1),name:n,hue:HUES[i%HUES.length]}));
  const now=Date.now(),day=864e5;
  for(let d=9;d>=0;d--){                       // ten school days of history
    const nEv=6+Math.floor(rng()*8);
    for(let e=0;e<nEv;e++){
      const rule=S.rules[Math.floor(rng()*S.rules.length)];
      const howMany=1+Math.floor(rng()*3);
      const picked=[];
      while(picked.length<howMany){const st=S.students[Math.floor(rng()*S.students.length)];if(!picked.includes(st.id))picked.push(st.id);}
      S.records.push({id:uid(),ts:now-d*day-Math.floor(rng()*6)*36e5,studentIds:picked,ruleId:rule.id,ruleLabel:(LANG==="zh"&&rule.zh?rule.zh:rule.label)+" "+rule.icon,value:rule.value,undone:false});
    }
  }
  const gifters=[S.students[2],S.students[5],S.students[8],S.students[11],S.students[14]];
  gifters.forEach((st,i)=>{
    const g=S.gifts[i%3];
    S.requests.push({id:uid(),studentId:st.id,itemId:g.id,itemLabel:g.emoji+" "+g.name,cost:g.price,status:"approved",note:"",ts:now-(i+2)*day,decidedTs:now-(i+2)*day+36e5});
    S.collection[st.id]=S.collection[st.id]||[];
    S.collection[st.id].push({name:g.name,emoji:g.emoji,rar:"common",source:"shop",ts:now-(i+2)*day});
  });
  S.collection[S.students[4].id]=[{name:"Unicorn",zh:"独角兽",emoji:"🦄",rar:"rare",source:"box",ts:now-2*day}];
  S.records.sort((a,b)=>b.ts-a.ts);
  save();
}

/* ---- mutations ---- */
function byId(id){return S.students.find(s=>s.id===id);}
function giftById(id){return S.gifts.find(g=>g.id===id);}
function applyRule(rule,ids){
  const prev={};ids.forEach(id=>prev[id]=levelOf(growthOf(byId(id))));
  S.records.unshift({id:uid(),ts:Date.now(),studentIds:[...ids],ruleId:rule.id,ruleLabel:(LANG==="zh"&&rule.zh?rule.zh:rule.label)+" "+rule.icon,value:rule.value,undone:false});
  save();
  ids.forEach(id=>{const now=lvlProgress(growthOf(byId(id))).i;if(now>prev[id])queueLevelUp(byId(id),now);});
}
function undoRecord(rec){rec.undone=true;save();}
function requestGift(stId,gift){
  S.requests.unshift({id:uid(),studentId:stId,itemId:gift.id,itemLabel:gift.emoji+" "+(LANG==="zh"&&gift.zh?gift.zh:gift.name),cost:gift.price,status:"pending",note:"",ts:Date.now()});
  save();
}
function decide(req,ok){
  if(req.status!=="pending")return;
  if(ok){
    req.status="approved";req.decidedTs=Date.now();
    const g=giftById(req.itemId);
    if(g){g.stock=(g.stock==null)?null:g.stock-1;S.collection[req.studentId]=S.collection[req.studentId]||[];S.collection[req.studentId].push({name:(LANG==="zh"&&g.zh?g.zh:g.name),emoji:g.emoji,rar:"common",source:"shop",ts:Date.now()});}
  }else{req.status="declined";req.decidedTs=Date.now();}
  save();
}
function openBox(stId){
  const st=byId(stId);
  if(walletOf(st)<BOX_PRICE)return null;
  const roll=Math.random();
  const pool=roll<.6?BOX_POOL.filter(x=>x.rar==="common"):roll<.9?BOX_POOL.filter(x=>x.rar==="rare"):BOX_POOL.filter(x=>x.rar==="epic");
  const won=pool[Math.floor(Math.random()*pool.length)];
  S.boxSpent[stId]=(S.boxSpent[stId]||0)+BOX_PRICE;
  S.collection[stId]=S.collection[stId]||[];
  S.collection[stId].push({...won,source:"box",ts:Date.now()});
  save();return won;
}

function route(){
  const h=location.hash||"#/";
  closeOverlays();
  if(window._gsGazeCleanup&&(h.startsWith("#/app")||h.startsWith("#/room/")))window._gsGazeCleanup();
  if(window._gsBurstCleanup&&(h.startsWith("#/app")||h.startsWith("#/room/")))window._gsBurstCleanup();
  if(h.startsWith("#/room/")){const id=decodeURIComponent(h.slice(7));renderRoom(byId(id)?id:null);return;}
  if(h.startsWith("#/app")){
    const tab=(h.split("/")[2]||"classroom");
    renderShell(["classroom","records","shop","leaderboard","settings"].includes(tab)?tab:"classroom");
    return;
  }
  renderLanding();
}

let levelUpQueue=[];
function queueLevelUp(st,lv){levelUpQueue.push({st,lv});}
function flushLevelUps(){
  if(!levelUpQueue.length)return;
  const {st,lv}=levelUpQueue.shift();
  const L=LEVELS[lv];
  const el=document.createElement("div");el.className="lvlup";
  el.innerHTML='<div class="card stk"><span class="medal">'+L.badge+'</span><h2 style="font-family:var(--font-round)">Level '+(lv+1)+'!</h2><p style="margin-top:6px"><b>'+esc(st.name)+'</b> reached <b>'+esc(nm(L))+'</b></p><div class="btns" style="justify-content:center"><button class="btn gold" onclick="this.closest(\'.lvlup\').remove();flushLevelUps()">${t("celebrate")}</button></div></div>';
  el.addEventListener("click",e=>{if(e.target===el){el.remove();flushLevelUps();}});
  document.body.appendChild(el);
}
function giftBurst(won,after){
  const el=document.createElement("div");el.className="burst";
  const cols=["#E9A93D","#186F65","#D95A3F","#FBF0DA"];
  let conf="";for(let i=0;i<16;i++){const x=(Math.random()*60-30),d=(Math.random()*.3);conf+='<i class="conf" style="left:calc(50% + '+x+'px);top:38%;background:'+cols[i%4]+';animation-delay:'+(0.8+d)+'s"></i>';}
  el.innerHTML='<div class="box">🎁</div><div class="gift">'+won.emoji+'</div>'+conf;
  el.addEventListener("click",()=>{el.remove();if(after)after();});
  document.body.appendChild(el);
  setTimeout(()=>{el.remove();if(after)after();},2600);
}

function pendingCount(){return S.requests.filter(q=>q.status==="pending").length;}
function approvedCountFor(stId,giftId){return S.requests.filter(q=>q.status==="approved"&&q.studentId===stId&&q.itemId===giftId).length;}

function viewShop(){
  const pend=S.requests.filter(q=>q.status==="pending");

  </div>

  <div class="shopgrid">
    ${S.gifts.map(itemCard).join("")}

}
function reqRow(q){
  const st=byId(q.studentId);
  return `<div class="row stk reqrow">
    <span class="st-who">${st?esc(st.name):"?"}</span>
    <span class="st-gift">${esc(q.itemLabel)} · <b class="num">★ ${q.cost}</b></span>
    <span class="meta num">${fmtDT(q.ts)}</span>
    <span class="pill pending">${t("pending")}</span>
    <button class="btn sm primary" onclick="decideReq('${q.id}',true)">${t("approve")}</button>
    <button class="btn sm" onclick="decideReq('${q.id}',false)">${t("decline")}</button>
  </div>`;
}
function itemCard(g){
  const off=g.active===false;
  const stock=g.stock==null?'<span class="pill approved">'+(LANG==="zh"?"库存 ∞":"stock ∞")+'</span>':(g.stock>0?'<span class="pill approved">'+(LANG==="zh"?"库存 "+g.stock:"stock "+g.stock)+'</span>':'<span class="pill declined">'+t("soldOut")+'</span>');
  return `<div class="item stk${off?" off":""}">
    <div class="top"><span class="emoji">${g.emoji}</span>${stock}</div>
    <h3>${esc(nm(g))}</h3>
    <p class="desc">${esc(g.desc)}${g.per?`${t("perLimit",{n:g.per})}`:""}</p>
    <div class="row-b">
      <span class="price num">★ ${g.price}</span>
      <button class="btn sm gold" onclick="openGive('${g.id}')" ${off?"disabled":""}>${t("giveNow")}</button>
      <button class="btn sm ghost" onclick="toggleItem('${g.id}')" aria-pressed="${off}">${off?t("backShelf"):t("takeOff")}</button>
    </div>
  </div>`;
}
function toggleItem(id){const g=giftById(id);g.active=g.active===false;save();viewShop();}
function decideReq(id,ok){
  const q=S.requests.find(x=>x.id===id);if(!q||q.status!=="pending")return;
  if(ok){
    const st=byId(q.studentId),g=giftById(q.itemId);
    if(!st||!g){toast("This gift no longer exists");return;}
    if(g.active===false){toast(t("offShelf2"));return;}
    if(g.stock!=null&&g.stock<=0){toast("Sold out: raise the stock to approve.");return;}
    if(g.per&&approvedCountFor(st.id,g.id)>=g.per){toast(st.name+" hit the limit of "+g.per+" for this gift");return;}
    if(walletOf(st)<q.cost){toast(st.name+" only has ★ "+walletOf(st)+" now. Ratings first, then approve.");return;}
  }
  decide(q,ok);
  toast(ok?("Granted: "+q.itemLabel):("Declined: "+q.itemLabel));
  viewShop();
}
/* "Give now" modal: pick a student */
function openGive(giftId){
  const g=giftById(giftId);if(!g)return;
  modal(`<h2>Give: ${esc(g.emoji+" "+g.name)}</h2>
    <p style="font-size:14px;color:var(--ink-soft)">Instant grant: stars are spent now, the gift lands on the student's shelf.</p>

    <select id="giveSel" style="margin-top:6px">${S.students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+" (★ "+walletOf(s)+")</option>").join("")}</select>
    <div class="btns"><button class="btn ghost" onclick="closeOverlays()">Cancel</button><button class="btn gold" onclick="doGive('${giftId}')">Spend ★ ${g.price} and give</button></div>`);
}
function doGive(giftId){
  const selId=$("#giveSel").value,g=giftById(giftId),st=byId(selId);
  closeOverlays();
  if(!st||!g)return;
  if(g.active===false){toast(t("offShelf"));return;}
  if(g.stock!=null&&g.stock<=0){toast("Sold out");return;}
  if(g.per&&approvedCountFor(st.id,g.id)>=g.per){toast(st.name+" already hit the limit for this gift");return;}
  if(walletOf(st)<g.price){toast(st.name+" only has ★ "+walletOf(st));return;}
  const q={id:uid(),studentId:st.id,itemId:g.id,itemLabel:g.emoji+" "+g.name,cost:g.price,status:"pending",note:"given by teacher",ts:Date.now()};
  S.requests.unshift(q);
  decide(q,true);
  toast(t("givenTo")+st.name+": "+g.name);
  viewShop();
}

/* ---------- gaze: smoothed cursor-following pupils (ported math) ---------- */
const GS_TAU=Math.PI*2;
const gsNorm=a=>((a%GS_TAU)+GS_TAU)%GS_TAU;
const gsDelta=(from,to)=>gsNorm(to-from+Math.PI)-Math.PI;
const gsDist=(a,b)=>Math.abs(gsDelta(a,b));
function gsDamp(current,target,elapsedMs){
  const delta=gsDelta(current,target);
  if(Math.abs(delta)<0.003)return gsNorm(target);
  const dt=Math.max(0,Math.min(elapsedMs,40));
  const amount=Math.min(Math.abs(delta)*-Math.expm1(-dt/85),dt*0.01);
  return gsNorm(current+Math.sign(delta)*amount);
}
const GS_REST=-Math.PI/2;            // a gentle upward glance at rest
const GS_PUPIL_RX=13,GS_PUPIL_RY=10; // travel inside the sculpted sockets

function initGaze(){
  if(!document.documentElement.classList.contains("gs-motion"))return;
  const char=$("#gs-char");if(!char)return;
  const pupils=[char.querySelector("#gs-pupil-l"),char.querySelector("#gs-pupil-r")];
  const narrow=matchMedia("(max-width: 700px)");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)");
  const fine=matchMedia("(hover: hover) and (pointer: fine)");
  let raf=0,disposed=false,mode="",pointer=null,eye=null,geoDirty=true;
  let targetAngle=null,easedAngle=null,lastTick=0;
  const apply=(x=0,y=-6)=>pupils.forEach(p=>p&&p.setAttribute("transform","translate("+x.toFixed(2)+","+y.toFixed(2)+")"));
  const currentMode=()=> (reduced.matches||narrow.matches||!fine.matches)?"still":"gaze";
  const schedule=()=>{if(!disposed&&!document.hidden&&!raf&&mode==="gaze")raf=requestAnimationFrame(tick);};
  function tick(now){
    raf=0;
    if(disposed||document.hidden||mode!=="gaze")return;
    const elapsed=lastTick?now-lastTick:1000/60;lastTick=now;
    if(pointer){
      if(geoDirty||!eye){
        const rect=char.getBoundingClientRect();       // svg keeps its viewBox aspect, so scale is uniform
        const scale=rect.width/520;
        eye={x:rect.left+260*scale,y:rect.top+330*scale}; // eye midpoint in viewBox coordinates
        geoDirty=false;
      }
      const dx=pointer.x-eye.x,dy=pointer.y-eye.y;
      // Ignore jitter immediately between the eyes, where angle is unstable.
      if(Math.hypot(dx,dy)>22)targetAngle=Math.atan2(dy,dx);
    }
    if(targetAngle===null){easedAngle=null;apply();return;}
    if(easedAngle===null)easedAngle=GS_REST;
    easedAngle=gsDamp(easedAngle,targetAngle,elapsed);
    apply(Math.cos(easedAngle)*GS_PUPIL_RX,Math.sin(easedAngle)*GS_PUPIL_RY-6);
    if(gsDist(easedAngle,targetAngle)>0.00001)schedule();
    else{easedAngle=gsNorm(targetAngle);apply(Math.cos(easedAngle)*GS_PUPIL_RX,Math.sin(easedAngle)*GS_PUPIL_RY-6);}
  }
  const onPointer=event=>{if(event.pointerType==="touch"||mode!=="gaze")return;pointer={x:event.clientX,y:event.clientY};schedule();};
  const onGeometry=()=>{geoDirty=true;if(mode==="gaze")schedule();};
  const applyMode=()=>{
    const next=currentMode();
    if(next!==mode){targetAngle=null;easedAngle=null;lastTick=0;geoDirty=true;apply();}
    mode=next;schedule();
  };
  const onVisibility=()=>{lastTick=0;if(document.hidden){cancelAnimationFrame(raf);raf=0;}else applyMode();};
  window.addEventListener("pointermove",onPointer,{passive:true});
  window.addEventListener("resize",onGeometry,{passive:true});
  window.addEventListener("scroll",onGeometry,{passive:true});
  document.addEventListener("visibilitychange",onVisibility);
  narrow.addEventListener("change",applyMode);reduced.addEventListener("change",applyMode);fine.addEventListener("change",applyMode);
  let observer=null;
  try{if(typeof ResizeObserver!=="undefined"){observer=new ResizeObserver(onGeometry);observer.observe(char);}}catch(_){}
  applyMode();
  window._gsGazeCleanup=()=>{
    disposed=true;cancelAnimationFrame(raf);raf=0;observer.disconnect();
    window.removeEventListener("pointermove",onPointer);window.removeEventListener("resize",onGeometry);
    window.removeEventListener("scroll",onGeometry);document.removeEventListener("visibilitychange",onVisibility);
    narrow.removeEventListener("change",applyMode);reduced.removeEventListener("change",applyMode);fine.removeEventListener("change",applyMode);
  };
}

/* ---------- click / tap leaf bursts (ported from GardenPlay) ---------- */
function initBursts(){
  if(!document.documentElement.classList.contains("gs-motion"))return;
  const page=$(".gs-page"),layer=$(".gs-bursts");if(!page||!layer)return;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)");
  let down=null,sequence=0;
  const timers=new Map();
  const onDown=event=>{if(event.button!==0||!event.isPrimary)return;down={x:event.clientX,y:event.clientY,id:event.pointerId};};
  const cancel=()=>{down=null;};
  const onUp=event=>{
    const origin=down;down=null;
    if(!origin||event.pointerId!==origin.id||reduced.matches||Math.hypot(event.clientX-origin.x,event.clientY-origin.y)>10)return;
    if(event.target&&event.target.closest&&event.target.closest("a,button,input,textarea,select"))return;
    const rect=layer.getBoundingClientRect();
    const id=++sequence;
    const bloom=document.createElement("div");bloom.className="gs-bloom";
    bloom.style.left=(event.clientX-rect.left)+"px";bloom.style.top=(event.clientY-rect.top)+"px";
    for(let index=0;index<6;index++){
      const angle=index/6*Math.PI*2;
      const radius=index%2===0?48:34;
      const petal=document.createElement("span");petal.className="gs-petal";
      petal.style.setProperty("--petal-x",(Math.cos(angle)*radius).toFixed(2)+"px");
      petal.style.setProperty("--petal-y",(Math.sin(angle)*radius-22).toFixed(2)+"px");
      petal.style.setProperty("--petal-turn",(index%2?85:-65)+"deg");
      petal.style.setProperty("--petal-delay",(index*15)+"ms");
      petal.innerHTML=GS_LEAF;
      bloom.appendChild(petal);
    }
    while(layer.children.length>=4)layer.firstElementChild.remove();  // at most four simultaneous bursts
    layer.appendChild(bloom);
    timers.set(id,setTimeout(()=>{bloom.remove();timers.delete(id);},1050));
  };
  const clearIfReduced=()=>{
    if(!reduced.matches)return;
    timers.forEach(clearTimeout);timers.clear();layer.innerHTML="";down=null;
  };
  page.addEventListener("pointerdown",onDown,{passive:true});
  page.addEventListener("pointerup",onUp,{passive:true});
  page.addEventListener("pointercancel",cancel,{passive:true});
  reduced.addEventListener("change",clearIfReduced);
  window._gsBurstCleanup=()=>{
    timers.forEach(clearTimeout);timers.clear();
    page.removeEventListener("pointerdown",onDown);
    page.removeEventListener("pointerup",onUp);
    page.removeEventListener("pointercancel",cancel);
    reduced.removeEventListener("change",clearIfReduced);
  };
}
